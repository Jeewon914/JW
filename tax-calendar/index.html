<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강김조 세금 캘린더</title>
<meta name="description" content="(주)강김조 세금 신고·납부 기한 캘린더">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="세금 캘린더">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: 왼쪽에 14개월 미니 달력 격자, 오른쪽에 고정된 상세 패널. 좁은 화면에서는 세로로 쌓임 */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1b2330; --muted:#647084; --line:#dfe3ea; --accent:#22304a;
  --tint:#eef1f6; --danger:#c0392b;
  --c-wht:#2b66d0; --c-vat:#d07a08; --c-corp:#c43d32; --c-local:#1d8a50; --c-report:#7a4cc2; --c-etc:#6a7686; --c-check:#0c8c98;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12151b; --surface:#1b2029; --ink:#e8ebf1; --muted:#98a2b3; --line:#2e3542; --accent:#dfe6f3;
    --tint:#242b37; --danger:#ef7b6f;
    --c-wht:#6c9cf2; --c-vat:#eda33a; --c-corp:#ef7b6f; --c-local:#4fc084; --c-report:#ab86ea; --c-etc:#9aa5b5; --c-check:#3fc0cb;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12151b; --surface:#1b2029; --ink:#e8ebf1; --muted:#98a2b3; --line:#2e3542; --accent:#dfe6f3;
  --tint:#242b37; --danger:#ef7b6f;
  --c-wht:#6c9cf2; --c-vat:#eda33a; --c-corp:#ef7b6f; --c-local:#4fc084; --c-report:#ab86ea; --c-etc:#9aa5b5; --c-check:#3fc0cb;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.next{background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:8px 14px;font:inherit;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center}
.next b{font-size:18px;font-weight:700}
.next span{font-size:12.5px;opacity:.85;display:block}
.next:focus-visible,.day:focus-visible,.up:focus-visible{outline:2px solid var(--c-wht);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .dash{border:1.5px dashed var(--muted);background:none}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 6px}
.month h2{font-size:12.5px;font-weight:600;margin:0 2px 4px;display:flex;justify-content:space-between}
.month h2 small{font-weight:400;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.dow{font-size:9.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell,.day{height:27px;border-radius:6px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px;color:var(--ink)}
.cell.off{color:var(--danger);opacity:.75}
.cell.past,.day.past{opacity:.42}
.day{border:0;background:var(--tint);font:inherit;font-size:11px;font-weight:700;cursor:pointer;position:relative}
.day:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent);opacity:1}
.today{box-shadow:inset 0 -2px 0 var(--danger)}
.pips{display:flex;gap:1.5px;margin-top:1px}
.pips i{width:5px;height:4px;border-radius:1.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.phead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.phead h2{margin:0;font-size:17px;font-weight:700}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--tint);white-space:nowrap}
.badge.soon{background:var(--danger);color:#fff}
.note{font-size:12px;color:var(--muted);margin-top:2px}
.prog{height:5px;border-radius:3px;background:var(--tint);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c-local);width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:11.5px;font-weight:600;color:var(--muted);margin:0;letter-spacing:.02em}
.item{border:1px solid var(--line);border-left:4px solid var(--k);border-radius:8px;padding:9px 11px}
.item.cond{border-style:dashed;border-left-style:solid}
.item h4{margin:0;font-size:13.5px;font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;font-weight:600;color:var(--k);border:1px solid var(--k);border-radius:4px;padding:0 5px}
.meta{font-size:12px;color:var(--muted);margin:2px 0 6px}
.item label{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;padding:2px 0;cursor:pointer}
.item input{margin:3px 0 0;accent-color:var(--k);flex:none}
.item input:checked+span{color:var(--muted);text-decoration:line-through}
.ups{display:flex;flex-direction:column;gap:4px}
.up{display:grid;grid-template-columns:64px 44px 1fr;gap:8px;align-items:center;border:0;background:none;color:inherit;font:inherit;font-size:12.5px;text-align:left;padding:5px 6px;border-radius:6px;cursor:pointer}
.up:hover{background:var(--tint)}
.up .d{font-weight:600}
.up .dd{color:var(--muted);font-size:11.5px}
.up .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{font-size:11.5px;color:var(--muted);max-width:75ch}
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .panel{position:static;max-height:none}
  .months{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>

<div class="wrap">

      <div class="sub">2026년 11월 ~ 2027년 12월 · 12월 결산 법인 · 서울 소재 · 기한은 주말·공휴일을 반영한 실제 마감일</div>
    </div>
    <button class="next" id="next" type="button"></button>
  </header>
  <div class="legend" id="legend"></div>
  <div class="main">
    <div class="months" id="months"></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

</div>

const HOL=new Set(["2026-12-25","2027-01-01","2027-02-06","2027-02-07","2027-02-08","2027-02-09","2027-03-01","2027-05-01","2027-05-05","2027-05-13","2027-06-06","2027-08-15","2027-08-16","2027-09-14","2027-09-15","2027-09-16","2027-10-03","2027-10-04","2027-10-09","2027-10-11","2027-12-25","2027-12-27"]);
const CATS={vat:['부가가치세','--c-vat'],corp:['법인세','--c-corp'],wht:['원천세','--c-wht'],local:['지방세','--c-local'],etc:['4대 보험·인지세','--c-etc'],report:['명세서·계산서 제출','--c-report'],check:['대상 여부 확인','--c-check']};
const PAY=['vat','corp','wht','local','etc'];
const DOW='일월화수목금토';
const byDate={};EVENTS.forEach(e=>byDate[e.date]=e);
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const now=new Date();const TODAY=key(now.getFullYear(),now.getMonth()+1,now.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const diff=s=>Math.round((parse(s)-parse(TODAY))/864e5);
const dlabel=n=>n===0?'D-DAY':n>0?'D-'+n:'지남';
const long=s=>{const d=parse(s);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;};
const short=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let store={};try{store=JSON.parse(localStorage.getItem('kkj-tax-checks')||'{}');}catch(e){}
const save=()=>{try{localStorage.setItem('kkj-tax-checks',JSON.stringify(store));}catch(e){}};
const upcoming=EVENTS.filter(e=>e.date>=TODAY);
let selected=(upcoming[0]||EVENTS[EVENTS.length-1]).date;

document.getElementById('legend').innerHTML=Object.values(CATS).map(([n,v])=>`<span><i style="background:var(${v})"></i>${n}</span>`).join('')+'<span><i class="dash"></i>해당 시에만</span>';

function catsOf(e){return [...new Set(e.items.filter(i=>!i.cond).map(i=>i.cat))];}
function renderMonths(){
  const out=[];
  for(let y=2026,m=11;!(y===2028&&m===1);){
    const first=new Date(y,m-1,1).getDay(),last=new Date(y,m,0).getDate();
    let cnt=0,cells='';
    for(const c of DOW)cells+=`<div class="dow">${c}</div>`;
    for(let i=0;i<first;i++)cells+='<div class="cell"></div>';
    for(let d=1;d<=last;d++){
      const k=key(y,m,d),e=byDate[k],dw=new Date(y,m-1,d).getDay();
      const cls=(k<TODAY?' past':'')+(k===TODAY?' today':'');
      if(e){cnt++;
        const pips=catsOf(e).map(c=>`<i style="background:var(${CATS[c][1]})"></i>`).join('');
        cells+=`<button type="button" class="day${cls}${k===selected?' sel':''}" data-d="${k}" aria-label="${long(k)} 기한 ${e.items.length}건">${d}<span class="pips">${pips}</span></button>`;
      }else cells+=`<div class="cell${cls}${(dw===0||dw===6||HOL.has(k))?' off':''}">${d}</div>`;
    }
    out.push(`<section class="month"><h2>${y}년 ${m}월<small>기한 ${cnt}일</small></h2><div class="grid">${cells}</div></section>`);
    m++;if(m>12){m=1;y++;}
  }
  document.getElementById('months').innerHTML=out.join('');
}
function itemHtml(e,it,idx){
  const v=CATS[it.cat][1];
  const checks=it.checks.map((c,j)=>{const id=`c-${e.date}-${idx}-${j}`;
    return `<label for="${id}"><input type="checkbox" id="${id}" data-k="${e.date}|${it.title}|${j}"${store[e.date+'|'+it.title+'|'+j]?' checked':''}><span>${esc(c)}</span></label>`;}).join('');
  return `<div class="item${it.cond?' cond':''}" style="--k:var(${v})"><h4>${esc(it.title)}<span class="tag">${CATS[it.cat][0]}</span></h4><div class="meta">${esc(it.period)} · ${esc(it.where)}</div>${checks}</div>`;
}
function renderPanel(){
  const e=byDate[selected],n=diff(selected);
  const idx=it=>e.items.indexOf(it);
  const pay=e.items.filter(i=>!i.cond&&PAY.includes(i.cat)),rep=e.items.filter(i=>!i.cond&&!PAY.includes(i.cat)),cond=e.items.filter(i=>i.cond);
  const sec=(t,a)=>a.length?`<div class="sec"><h3>${t} · ${a.length}건</h3>${a.map(i=>itemHtml(e,i,idx(i))).join('')}</div>`:'';
  const moved=e.legal!==e.date?`<div class="note">법정 기한 ${short(e.legal)}이 휴일이라 다음 영업일로 순연되었습니다.</div>`:'';
  const ups=upcoming.filter(u=>u.date!==selected).slice(0,6).map(u=>{
    const pips=catsOf(u).map(c=>`<i style="background:var(${CATS[c][1]})"></i>`).join('');
    const main=u.items.filter(i=>!i.cond&&i.cat!=='etc'&&i.cat!=='report');
    const t=(main.length?main:u.items).slice(0,3).map(i=>i.title.replace(' 신고·납부','')).join(', ');
    return `<button type="button" class="up" data-d="${u.date}"><span class="d">${short(u.date)}</span><span class="dd">${dlabel(diff(u.date))}</span><span class="t"><span class="pips" style="display:inline-flex;margin-right:6px">${pips}</span>${esc(t)}</span></button>`;}).join('');
  document.getElementById('panel').innerHTML=
    `<div><div class="phead"><h2>${long(selected)}</h2><span class="badge${n>=0&&n<=3?' soon':''}">${dlabel(n)}</span></div>${moved}<div class="note" id="pcount"></div></div>
     <div class="prog"><i id="pbar"></i></div>
     ${sec('납부할 세금',pay)}${sec('제출·확인할 항목',rep)}${sec('해당하는 경우만',cond)}
     <div class="sec"><h3>다가오는 기한</h3><div class="ups">${ups||'<span class="note">남은 기한이 없습니다.</span>'}</div></div>`;
  progress();
}
function progress(){
  const boxes=[...document.querySelectorAll('#panel .item:not(.cond) input')];
  const done=boxes.filter(b=>b.checked).length;
  document.getElementById('pcount').textContent=`준비 항목 ${done}/${boxes.length} 완료`;
  document.getElementById('pbar').style.width=(boxes.length?done/boxes.length*100:0)+'%';
}
function renderNext(){
  const u=upcoming[0],b=document.getElementById('next');
  if(!u){b.innerHTML='<span>남은 기한 없음</span>';return;}
  b.dataset.d=u.date;
  b.innerHTML=`<b>${dlabel(diff(u.date))}</b><div>다음 기한 ${short(u.date)}<span>${u.items.filter(i=>!i.cond).length}건 · ${catsOf(u).map(c=>CATS[c][0]).join(', ')}</span></div>`;
}
function select(d,scroll){
  selected=d;
  document.querySelectorAll('.day.sel').forEach(x=>x.classList.remove('sel'));
  const el=document.querySelector(`.day[data-d="${d}"]`);if(el)el.classList.add('sel');
  renderPanel();
  if(scroll&&window.matchMedia('(max-width:900px)').matches)document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'});
}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-d]');if(t)select(t.dataset.d,true);});
document.addEventListener('change',ev=>{const k=ev.target.dataset&&ev.target.dataset.k;if(!k)return;if(ev.target.checked)store[k]=1;else delete store[k];save();progress();});
renderMonths();renderNext();renderPanel();
</script>
