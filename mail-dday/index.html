<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>메일 회신 D-day</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--sub:#6f6a61;--line:#e4dfd5;--red:#c8372d;--amber:#b7791f;--green:#2f6f4f;--chip:#efeae0}
  @media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#201f1c;--ink:#f1eee7;--sub:#a39d91;--line:#34322d;--red:#ef6b60;--amber:#e0a94a;--green:#6fbf95;--chip:#2b2925}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
  main{max-width:720px;margin:0 auto;padding:24px 16px 56px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
  .meta{color:var(--sub);font-size:13px;margin-bottom:20px}
  h2{font-size:14px;color:var(--sub);font-weight:600;margin:28px 0 10px;letter-spacing:.02em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:center}
  .dd{flex:0 0 68px;text-align:center;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .dd small{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-top:2px}
  .urgent .dd{color:var(--red)} .soon .dd{color:var(--amber)} .later .dd{color:var(--green)} .none .dd,.past .dd{color:var(--sub)}
  .urgent{border-color:var(--red)}
  .body{min-width:0;flex:1}
  .title{font-weight:650;word-break:keep-all}
  .sub{color:var(--sub);font-size:13px;margin-top:2px}
  .chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;margin-right:6px}
  .empty{color:var(--sub);font-size:14px;padding:8px 2px}
  .sp{display:block}
  .sp .row{display:flex;gap:14px;align-items:center}
  .sp .dates{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .sp .date{background:var(--chip);border-radius:8px;padding:3px 9px;font-size:13px;font-variant-numeric:tabular-nums}
  .sp .date b{font-weight:700;margin-right:4px}
  .choice{display:flex;gap:8px;margin-top:12px}
  .choice label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:9px 0;font-weight:700;font-size:14px;cursor:pointer;user-select:none}
  .choice input{width:16px;height:16px;accent-color:var(--green)}
  .choice label.go.on{border-color:var(--green);color:var(--green)}
  .choice label.no.on{border-color:var(--red);color:var(--red)}
  .choice label.no input{accent-color:var(--red)}
  .sp.declined{opacity:.55}
  .hint{color:var(--sub);font-size:12px;margin:-4px 2px 10px}
  .tabs{display:flex;gap:8px;margin:0 0 6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;white-space:nowrap;padding-left:14px!important;padding-right:14px!important;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 0;font:inherit;font-size:14px;font-weight:650;cursor:pointer}
  .tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tabs button small{font-weight:600;opacity:.7;margin-left:4px}
  .bh{font-size:17px;font-weight:800;margin:26px 0 2px;padding-top:14px;border-top:2px solid var(--ink);letter-spacing:-.01em}
  .bh small{font-size:12px;font-weight:600;color:var(--sub);margin-left:6px}
  .st{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px}
  .st.me{background:var(--red);color:#fff} .st.them{background:var(--chip);color:var(--sub)} .st.check{background:var(--amber);color:#fff}
  .fu{display:block} .fu .title{font-weight:650} .fu .sub{margin-top:4px}
  .inf{display:block} .inf .kv{margin-top:8px;font-size:14px} .inf .kv b{display:inline-block;min-width:44px;color:var(--sub);font-weight:600;font-size:12px}
  .inf ul{margin:4px 0 0;padding-left:18px;font-size:14px} .inf .next{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
  .choice label.ret.on{border-color:var(--sub);color:var(--ink);background:var(--chip)}
  .sp.returned{opacity:.6}
  .inf .kv2{display:grid;grid-template-columns:64px 1fr;gap:4px 8px;margin-top:10px;font-size:14px}
  .inf .kv2 b{color:var(--sub);font-weight:600;font-size:12px;padding-top:2px}
  .camp table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  .camp th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  .camp td{padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .camp td.d{font-weight:700;white-space:nowrap}
  .stale{background:var(--red);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<main>
  <h1>메일 회신 D-day</h1>
  <div class="meta" id="meta">불러오는 중…</div>
  <div class="stale" id="stale"></div>
  <div class="tabs" id="tabs"></div>
  <div id="brands"></div>
  <div id="collab"><div class="bh">협업·협찬</div>
  <h2>인플루언서 협업</h2><div id="inf"></div>
  <h2>캠페인 (협업 플랫폼)</h2><div id="camp"></div>
  <h2>연예인 협찬 문의</h2><div class="hint">협찬하실 건은 GO, 하지 않을 건은 NO, 제품을 회수하면 RETURN을 눌러 주십시오. 선택은 이 기기에 저장됩니다.</div><div id="sp-inbox"></div>
  <h2>협찬 진행 일정 (GO · RETURN)</h2><div id="sp-go"></div>
  </div>
</main>
<script>
const WD=['일','월','화','수','목','금','토'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kst=d=>new Date(d.getTime()+9*3600e3);
const dayNum=d=>Math.floor(kst(d).getTime()/864e5);
function fmt(iso,withTime=true){const k=kst(new Date(iso));const p=n=>String(n).padStart(2,'0');
  const s=`${k.getUTCMonth()+1}/${k.getUTCDate()}(${WD[k.getUTCDay()]})`;return withTime?`${s} ${p(k.getUTCHours())}:${p(k.getUTCMinutes())}`:s}
function dday(iso){if(!iso)return{label:'—',cls:'none',n:1e9};const now=new Date(),t=new Date(iso);const n=dayNum(t)-dayNum(now);
  if(t<now)return{label:'마감',cls:'past',n:1e8};
  return{label:n===0?'D-DAY':`D-${n}`,cls:n<=1?'urgent':n<=7?'soon':'later',n}}
function card(dd,chip,title,sub){return `<div class="card ${dd.cls}"><div class="dd">${dd.label}</div><div class="body"><div class="title">${chip?`<span class="chip">${esc(chip)}</span>`:''}${esc(title)}</div><div class="sub">${esc(sub)}</div></div></div>`}
const BR=[['rom','로맨티누어','키브젝트 포함'],['cx','챕터엑스',''],['etc','공통·기타','']];
const bOf=x=>x.brand==='cx'?'cx':x.brand==='etc'?'etc':'rom';
let DATA=null,TAB='all';
try{TAB=localStorage.getItem('mailDday.tab')||'all'}catch(e){}
function section(d,key){
  const now=new Date();
  const R=(d.replies||[]).filter(r=>bOf(r)===key).map(r=>({...r,dd:dday(r.due)})).sort((a,b)=>a.dd.n-b.dd.n);
  const M=(d.meetings||[]).filter(m=>bOf(m)===key&&new Date(m.when).getTime()+3*36e5>Date.now()).map(m=>({...m,dd:dday(m.when)})).sort((a,b)=>new Date(a.when)-new Date(b.when));
  const E=(d.events||[]).filter(e=>bOf(e)===key&&new Date(e.end)>now).sort((a,b)=>new Date(a.start)-new Date(b.start));
  let h='';
  h+='<h2>회신·제출 기한</h2>'+(R.length?R.map(r=>card(r.dd,r.platform,r.title,(r.due?`${fmt(r.due)}까지`:'기한 없음')+(r.note&&r.due?` · ${r.note}`:(!r.due&&r.note&&r.note!=='기한 없음'?` · ${r.note}`:'')))).join(''):'<div class="empty">회신할 메일이 없습니다.</div>');
  const SL={me:'내 차례',them:'상대 회신 대기',check:'확인 필요'},SO={me:0,check:1,them:2};
  const F=(d.followups||[]).filter(f=>bOf(f)===key).sort((a,b)=>(SO[a.state]??3)-(SO[b.state]??3));
  if(F.length)h+='<h2>팔로우업 (아직 끝나지 않은 건)</h2>'+F.map(f=>`<div class="card fu"><div class="title"><span class="st ${esc(f.state)}">${SL[f.state]||''}</span>${f.platform?`<span class="chip">${esc(f.platform)}</span>`:''}${esc(f.title)}</div><div class="sub">${esc(f.note||'')}</div></div>`).join('');
  if(M.length)h+='<h2>미팅 일정</h2>'+M.map(m=>card(m.dd,m.kind,m.title,fmt(m.when))).join('');
  if(E.length)h+='<h2>기획전 일정</h2>'+E.map(e=>{const on=new Date(e.start)<=now;const dd=on?{label:'진행 중',cls:'later'}:dday(e.start);return card(dd,e.platform,e.title,`${fmt(e.start)} ~ ${fmt(e.end)}`)}).join('');
  return {html:h,count:R.length,empty:!R.length&&!M.length&&!E.length};
}
function draw(){
  const d=DATA;if(!d)return;
  const secs=BR.map(([k,n,sub])=>({k,n,sub,...section(d,k)})).filter(x=>!(x.k==='etc'&&x.empty));
  if(TAB!=='all'&&TAB!=='collab'&&!secs.some(x=>x.k===TAB))TAB='all';
  const total=secs.reduce((a,x)=>a+x.count,0);
  document.getElementById('tabs').innerHTML=`<button data-tab="all" class="${TAB==='all'?'on':''}">전체<small>${total}</small></button>`+secs.map(x=>`<button data-tab="${x.k}" class="${TAB===x.k?'on':''}">${x.n}<small>${x.count}</small></button>`).join('')+`<button data-tab="collab" class="${TAB==='collab'?'on':''}">협업<small>${(d.influencers||[]).length+(d.campaigns||[]).reduce((a,c)=>a+(c.members||[]).length,0)}</small></button>`;
  document.getElementById('collab').style.display=(TAB==='all'||TAB==='collab')?'':'none';
  document.getElementById('brands').innerHTML=secs.filter(x=>TAB==='all'||TAB===x.k).map(x=>`<div class="bh">${x.n}${x.sub?`<small>${x.sub}</small>`:''}</div>${x.html}`).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-tab]');if(!b)return;TAB=b.dataset.tab;try{localStorage.setItem('mailDday.tab',TAB)}catch(_){ }draw()});
function render(d){
  DATA=d;
  const up=new Date(d.updated);
  document.getElementById('meta').textContent=`마지막 수집: ${fmt(d.updated)}`;
  if((Date.now()-up)/36e5>26){const s=document.getElementById('stale');s.style.display='block';s.textContent='24시간 넘게 갱신되지 않았습니다. PC에서 수집을 요청해 주십시오.'}
  draw();
  SP=d.sponsorships||[];spRender();
  const I=d.influencers||[],SL2={me:'내 차례',them:'상대 회신 대기',check:'확인 필요',done:'완료'};
  const BN=b=>b==='cx'?'CHAPTER X':b==='kb'?'KIBJECT':'ROMANTINUER';
  document.getElementById('inf').innerHTML=I.length?I.map(x=>`<div class="card inf"><div class="title">${BN(x.brand)} - ${esc(x.name)} <span class="st ${esc(x.state)}">${SL2[x.state]||''}</span></div>
  <div class="kv2"><b>소통방식</b><span>${esc(x.channel||'')}</span><b>형식</b><span>${esc(x.format||'')}</span><b>비용</b><span>${esc(x.cost||'')}</span><b>제품</b><span>${(x.products||[]).map(esc).join('<br>')}</span>${x.schedule?`<b>일정</b><span>${esc(x.schedule)}</span>`:''}</div>
  <div class="next"><b>다음 할 일</b> ${esc(x.next||'')}</div></div>`).join(''):'<div class="empty">진행 중인 인플루언서 협업이 없습니다.</div>';
  const C=d.campaigns||[];
  document.getElementById('camp').innerHTML=C.length?C.map(c=>`<div class="card inf camp"><div class="title">${BN(c.brand)} - ${esc(c.name)}</div>
  <div class="kv2"><b>소통방식</b><span>${esc(c.channel||'')}</span><b>제품</b><span>${esc(c.product||'')}</span><b>출고</b><span>${esc(c.shipped||'')}</span></div>
  <table><tr><th>인스타 ID</th><th>컬러</th><th>업로드 마감</th><th></th></tr>${(c.members||[]).slice().sort((a,b)=>(a.due||'').localeCompare(b.due||'')).map(m=>`<tr><td>${esc(m.id)}</td><td>${esc(m.color||'')}</td><td>${m.due?md(m.due):'미정'}</td><td class="d">${m.done?'완료':m.due?ddLabel(m.due):''}</td></tr>`).join('')}</table></div>`).join(''):'<div class="empty">진행 중인 캠페인이 없습니다.</div>';
}
const SPK='mailDday.sponsor.v1';
const spLoad=()=>{try{return JSON.parse(localStorage.getItem(SPK)||'{}')||{}}catch(e){return {}}};
const spSave=o=>{try{localStorage.setItem(SPK,JSON.stringify(o))}catch(e){}};
const dOnly=s=>new Date(s+'T00:00:00+09:00');
function dayDiff(s){return dayNum(dOnly(s))-dayNum(new Date())}
function ddLabel(s){const n=dayDiff(s);return n===0?'D-DAY':n>0?`D-${n}`:`D+${-n}`}
function md(s){const k=kst(dOnly(s));return `${k.getUTCMonth()+1}/${k.getUTCDate()}(${WD[k.getUTCDay()]})`}
let SP=[];
function spMerged(){
  const st=spLoad(),map={};
  SP.forEach(x=>{map[x.id]={...x}});
  Object.keys(st).forEach(id=>{const e=st[id];if(!e)return;
    if(map[id]){const dd=map[id].decision||'';if(e.base===undefined?(!dd||dd===e.decision||dd==='go'&&e.decision!=='go'&&false):e.base===dd)map[id].decision=e.decision}else if((e.decision==='go'||e.decision==='return')&&e.item){map[id]={...e.item,decision:'go'}}});
  return Object.values(map).filter(x=>!x.return||dayDiff(x.return)>=-7)
    .sort((a,b)=>(a.pickup||'').localeCompare(b.pickup||''));
}
function spCard(x){
  const d=x.decision||'',n=x.pickup?dayDiff(x.pickup):99;
  const cls=d==='return'?'returned none':d==='no'?'declined none':(x.return&&dayDiff(x.return)<0)?'past':n<=1?'urgent':n<=7?'soon':'later';
  const head=d==='return'?{l:'회수',s:'완료'}:x.pickup&&dayDiff(x.pickup)>=0?{l:ddLabel(x.pickup),s:'픽업'}:x.return?{l:ddLabel(x.return),s:'반납'}:{l:'—',s:''};
  const sched=x.schedule_start?`<span class="date"><b>일정</b>${md(x.schedule_start)}${x.schedule_end?' ~ '+md(x.schedule_end):''}</span>`:'';
  return `<div class="card sp ${cls}"><div class="row"><div class="dd">${head.l}<small>${head.s}</small></div><div class="body"><div class="title"><span class="chip">${x.brand==='cx'?'챕터엑스':'로맨티누어'}</span>${esc(x.title)}</div>
  <div class="dates"><span class="date"><b>픽업</b>${x.pickup?md(x.pickup):'미정'}</span>${sched}<span class="date"><b>반납</b>${x.return?md(x.return):'미정'}</span></div></div></div>
  <div class="choice"><label class="go ${d==='go'?'on':''}"><input type="checkbox" data-id="${esc(x.id)}" data-v="go" ${d==='go'?'checked':''}>GO</label><label class="no ${d==='no'?'on':''}"><input type="checkbox" data-id="${esc(x.id)}" data-v="no" ${d==='no'?'checked':''}>NO</label><label class="ret ${d==='return'?'on':''}"><input type="checkbox" data-id="${esc(x.id)}" data-v="return" ${d==='return'?'checked':''}>RETURN</label></div></div>`}
function spRender(){
  const all=spMerged(),go=all.filter(x=>x.decision==='go'||x.decision==='return'),rest=all.filter(x=>x.decision!=='go'&&x.decision!=='return');
  document.getElementById('sp-inbox').innerHTML=rest.length?rest.map(spCard).join(''):'<div class="empty">검토할 협찬 문의가 없습니다.</div>';
  document.getElementById('sp-go').innerHTML=go.length?go.map(spCard).join(''):'<div class="empty">진행 중인 협찬이 없습니다.</div>';
}
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.id)return;
  const id=t.dataset.id,v=t.checked?t.dataset.v:'',st=spLoad(),item=spMerged().find(x=>x.id===id);
  const copy=item?{...item}:null;if(copy)delete copy.decision;
  const base=(SP.find(x=>x.id===id)||{}).decision||'';st[id]={decision:v,item:copy,base};spSave(st);spRender()});
const RAW='https://raw.githubusercontent.com/Jeewon914/JW/mail-dday-data/mail-dday/data.json';
const get=u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});
get(RAW).catch(()=>get('data.json')).then(render).catch(()=>{document.getElementById('meta').textContent='데이터를 불러오지 못했습니다.'});
</script>
</body>
</html>
